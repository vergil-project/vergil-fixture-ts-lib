name: CD

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  pull-requests: write

jobs:
  docs:
    uses: vergil-project/vergil-actions/.github/workflows/cd-docs.yml@v2.1
    permissions:
      contents: write
    # `inherit` is required: the automation App keys live in the
    # `automation` environment, and environment secrets reach a cross-repo
    # reusable workflow only under `secrets: inherit`. Allowed only for the
    # App-key workflows (vrg-validate's secrets-inherit check).
    secrets: inherit

  release:
    if: github.ref == 'refs/heads/main'
    uses: vergil-project/vergil-actions/.github/workflows/cd-release.yml@v2.1
    with:
      language: ts-node
    # `inherit` is required: the automation App keys live in the
    # `automation` environment, and environment secrets reach a cross-repo
    # reusable workflow only under `secrets: inherit`. Allowed only for the
    # App-key workflows (vrg-validate's secrets-inherit check).
    secrets: inherit
